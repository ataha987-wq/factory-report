<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بلاغات الصيانة - شركة شموع الماضي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--gold:#C8962E;--brown:#6B4423;--ink:#2B1D0E;--cream:#FBF7EF;--line:#E6DCC8;--ok:#2E7D4F;--warn:#B8641A;--bad:#B3261E;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{direction:ltr;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:#fff;border-bottom:4px solid var(--gold)}
header img{height:64px;width:auto}
.dept{direction:rtl;text-align:right;line-height:1.35}
.dept b{display:block;font-size:1.15rem;color:var(--brown)}
.dept span{font-size:.95rem;color:var(--gold);font-weight:600}
main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:16px}
footer{text-align:center;padding:14px;font-size:.85rem;color:var(--brown);border-top:1px solid var(--line);background:#fff}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
h2{margin:0 0 14px;font-size:1.15rem;color:var(--brown)}
label{display:block;font-weight:600;margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #cdbf9f;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;background:var(--brown);color:#fff}
button.gold{background:var(--gold);color:#2B1D0E}
button.ghost{background:#fff;color:var(--brown);border:1px solid var(--brown)}
button.danger{background:var(--bad)}
button.ok{background:var(--ok)}
button:disabled{opacity:.55;cursor:wait}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
.tabs button{background:#fff;color:var(--brown);border:1px solid var(--line);white-space:nowrap}
.tabs button.on{background:var(--brown);color:#fff;border-color:var(--brown)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.who{font-weight:700}
.stamp{background:#F3EAD6;border-radius:8px;padding:9px 12px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.rep{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--warn);border-radius:10px;padding:14px;margin-bottom:12px}
.rep.done{border-inline-start-color:var(--ok)}
.rep header{all:unset;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.9rem;color:#6b5a3f}
.badge{padding:2px 10px;border-radius:99px;font-weight:700;font-size:.85rem;color:#fff;background:var(--warn)}
.done .badge{background:var(--ok)}
.rep p{margin:10px 0;white-space:pre-wrap}
.steps{margin:10px 0 0;padding:0;list-style:none;border-top:1px dashed var(--line)}
.steps li{padding:7px 0;border-bottom:1px dashed var(--line);font-size:.93rem}
.steps small{color:#6b5a3f;display:block}
.empty{text-align:center;padding:30px;color:#6b5a3f}
.msg{padding:9px 12px;border-radius:8px;margin-top:12px;font-weight:600}
.msg.err{background:#FDE8E6;color:var(--bad)}.msg.good{background:#E3F3EA;color:var(--ok)}
.chk{display:inline-flex;align-items:center;gap:6px;margin:0;font-weight:600}
.chk input{width:auto}
.hide{display:none}
@media (prefers-reduced-motion:no-preference){.panel{animation:in .3s}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<header>
  <img src="logo.jpg" alt="شموع الماضي">
  <div class="dept"><b>إدارة اللوجستيات</b><span>قسم الصيانة العمومية</span></div>
</header>
<main id="app"></main>
<footer>تصميم أحمد طه — مكتب نائب الرئيس التنفيذي</footer>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxhFnL2I-I-rWyZbMucIXu5i9xn39E2-q76IGy8tvEeyrKIXIjumUDb6KwF2UhKjBkW/exec';
const USERS = ['مصنع اطايب نجد','مصنع الروائع','مصنع قرمشنى','مصنع الخرج','سكن العمال','مسئول الصيانة العمومية'];
const MAINT = 'مسئول الصيانة العمومية';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let me = null, tab = '', reports = [], photos = [], sig = '', timer = null;

try { me = JSON.parse(sessionStorage.getItem('me')); } catch (e) {}

async function api(action, data = {}) {
  const r = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action, user: me.user, pass: me.pass, ...data }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'حدث خطأ');
  return j;
}
const msg = (el, t, good) => { el.innerHTML = t ? `<div class="msg ${good ? 'good' : 'err'}">${esc(t)}</div>` : ''; };
const fmt = d => d ? String(d).replace('T', ' ') : '';

/* ---------- Login ---------- */
function showLogin() {
  clearInterval(timer);
  $('#app').innerHTML = `<div class="panel" style="max-width:420px;margin:30px auto">
    <h2>تسجيل الدخول</h2>
    <label for="u">اسم المستخدم</label>
    <select id="u">${USERS.map(u => `<option>${u}</option>`).join('')}</select>
    <label for="p">كلمة المرور</label>
    <input id="p" type="password" autocomplete="current-password">
    <div class="row"><button id="go" class="gold" style="flex:1">دخول</button></div>
    <div id="lm"></div></div>`;
  $('#p').addEventListener('keydown', e => e.key === 'Enter' && $('#go').click());
  $('#go').onclick = async () => {
    me = { user: $('#u').value, pass: $('#p').value };
    $('#go').disabled = true;
    try {
      await api('login');
      try { sessionStorage.setItem('me', JSON.stringify(me)); } catch (e) {}
      start();
    } catch (e) { me = null; msg($('#lm'), e.message); $('#go').disabled = false; }
  };
}

/* ---------- Shell ---------- */
function start() {
  const m = me.user === MAINT;
  tab = m ? 'open' : 'new';
  $('#app').innerHTML = `<div class="topbar"><span class="who">${esc(me.user)}</span><button class="ghost" id="out">تسجيل الخروج</button></div>
    <div class="tabs" id="tabs"></div><div id="view"></div>`;
  $('#out').onclick = () => { try { sessionStorage.removeItem('me'); } catch (e) {} me = null; showLogin(); };
  drawTabs(); refresh(true);
  clearInterval(timer);
  timer = setInterval(() => refresh(false), 30000);
}
function drawTabs() {
  const m = me.user === MAINT;
  const t = m ? [['open', 'البلاغات الواردة'], ['closed', 'البلاغات المغلقة']]
              : [['new', 'الإبلاغ عن عطل'], ['open', 'حالة البلاغات'], ['closed', 'البلاغات المغلقة']];
  $('#tabs').innerHTML = t.map(([k, v]) => `<button data-k="${k}" class="${k === tab ? 'on' : ''}">${v}</button>`).join('');
  $('#tabs').onclick = e => { const k = e.target.dataset.k; if (k) { tab = k; drawTabs(); draw(); } };
}
async function refresh(force) {
  try {
    const j = await api('list');
    const s = JSON.stringify(j.reports);
    if (s === sig && !force) return;
    const a = document.activeElement;
    if (!force && a && /TEXTAREA|INPUT/.test(a.tagName) && $('#view').contains(a)) return;
    sig = s; reports = j.reports; draw();
  } catch (e) { if (force) { $('#view').innerHTML = `<div class="msg err">${esc(e.message)}</div>`; } }
}
function draw() { tab === 'new' ? drawForm() : drawList(); }

/* ---------- Factory form ---------- */
function drawForm() {
  $('#view').innerHTML = `<div class="panel"><h2>الإبلاغ عن عطل</h2>
    <div class="stamp" id="clock"></div>
    <label for="d">وصف العطل</label><textarea id="d" placeholder="اكتب العطل: الماكينة، المشكلة، ومتى بدأت"></textarea>
    <label>صور العطل (اختياري)</label>
    <div class="row">
      <button class="ghost" id="cam">التقاط صورة بالكاميرا</button>
      <button class="ghost" id="gal">اختيار من الهاتف</button>
    </div>
    <input type="file" id="fc" accept="image/*" capture="environment" class="hide">
    <input type="file" id="fg" accept="image/*" multiple class="hide">
    <div class="thumbs" id="th"></div>
    <div class="row"><button class="gold" id="send" style="flex:1">إرسال البلاغ</button></div>
    <div id="fm"></div></div>`;
  const tick = () => { const c = $('#clock'); if (c) c.textContent = 'التاريخ والوقت: ' + new Date().toLocaleString('ar-SA-u-nu-latn', { dateStyle: 'full', timeStyle: 'short' }); };
  tick(); const iv = setInterval(() => { if (!$('#clock')) return clearInterval(iv); tick(); }, 20000);
  $('#cam').onclick = () => $('#fc').click();
  $('#gal').onclick = () => $('#fg').click();
  $('#fc').onchange = $('#fg').onchange = async e => {
    for (const f of e.target.files) photos.push(await shrink(f));
    e.target.value = ''; thumbs();
  };
  $('#send').onclick = async () => {
    const d = $('#d').value.trim();
    if (!d) return msg($('#fm'), 'اكتب وصف العطل أولاً');
    $('#send').disabled = true; msg($('#fm'), 'جاري الإرسال...', true);
    try {
      await api('create', { desc: d, images: photos });
      photos = []; sig = ''; await refresh(true);
      tab = 'open'; drawTabs(); draw();
    } catch (e) { msg($('#fm'), e.message); $('#send').disabled = false; }
  };
  thumbs();
}
function thumbs() { const t = $('#th'); if (t) t.innerHTML = photos.map((p, i) => `<img src="${p}" alt="صورة ${i + 1}" data-i="${i}" title="اضغط للحذف">`).join(''); if (t) t.onclick = e => { const i = e.target.dataset.i; if (i !== undefined) { photos.splice(i, 1); thumbs(); } }; }
function shrink(file) {
  return new Promise(res => {
    const img = new Image(), fr = new FileReader();
    fr.onload = () => { img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', .72));
    }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

/* ---------- Lists ---------- */
function drawList() {
  const m = me.user === MAINT, closed = tab === 'closed';
  const list = reports.filter(r => (r.status === 'تم الإصلاح') === closed);
  let h = '';
  if (m) h += `<div class="topbar"><label class="chk"><input type="checkbox" id="all"> تحديد الكل</label>
    <div class="row" style="margin:0"><button class="ghost" id="exp">تصدير تقارير (Excel)</button>
    <button class="danger" id="dsel">حذف المحدد</button><button class="danger" id="dall">حذف الكل</button></div></div>`;
  h += list.length ? list.map(r => card(r, m)).join('') : `<div class="empty panel">لا توجد بلاغات هنا</div>`;
  $('#view').innerHTML = h;
  if (!m) return;
  $('#all').onchange = e => document.querySelectorAll('.sel').forEach(c => c.checked = e.target.checked);
  $('#exp').onclick = exportXlsx;
  $('#dsel').onclick = () => del([...document.querySelectorAll('.sel:checked')].map(c => c.value));
  $('#dall').onclick = () => del(null);
  $('#view').onclick = async e => {
    const id = e.target.dataset.id; if (!id) return;
    const act = e.target.dataset.act;
    if (act === 'step') {
      const t = $(`#st${id}`).value.trim(); if (!t) return;
      e.target.disabled = true; await run(() => api('step', { id, text: t }));
    }
    if (act === 'close' && confirm('تأكيد إغلاق البلاغ: تم الإصلاح؟')) { e.target.disabled = true; await run(() => api('close', { id })); }
  };
}
async function run(fn) { try { await fn(); await refresh(true); } catch (e) { alert(e.message); } }
async function del(ids) {
  if (ids && !ids.length) return alert('حدد بلاغاً واحداً على الأقل');
  if (!confirm(ids ? `حذف ${ids.length} بلاغ؟ لا يمكن التراجع.` : 'حذف جميع البلاغات (المفتوحة والمغلقة)؟ لا يمكن التراجع.')) return;
  await run(() => api('delete', ids ? { ids } : { all: true }));
}
function card(r, m) {
  const done = r.status === 'تم الإصلاح';
  const imgs = r.images.length ? `<div class="thumbs">${r.images.map(i => `<a href="https://drive.google.com/file/d/${i}/view" target="_blank" rel="noopener"><img src="https://drive.google.com/thumbnail?id=${i}&sz=w400" alt="صورة العطل" loading="lazy"></a>`).join('')}</div>` : '';
  const steps = r.steps.length ? `<ul class="steps">${r.steps.map(s => `<li>${esc(s.text)}<small>${esc(fmt(s.t))}</small></li>`).join('')}</ul>` : `<ul class="steps"><li><small>لم تُسجّل خطوات بعد</small></li></ul>`;
  const ctl = m && !done ? `<label for="st${r.id}">خطوة جديدة</label><textarea id="st${r.id}" style="min-height:70px" placeholder="اكتب ما تم عمله"></textarea>
    <div class="row"><button data-act="step" data-id="${r.id}">إضافة الخطوة</button><button class="ok" data-act="close" data-id="${r.id}">تم الإصلاح</button></div>` : '';
  return `<article class="rep ${done ? 'done' : ''}"><header><span>${m ? `<label class="chk"><input type="checkbox" class="sel" value="${r.id}"> ` : ''}بلاغ #${r.id}${m ? ' — ' + esc(r.factory) : ''}${m ? '</label>' : ''}</span>
    <span>${esc(fmt(r.date))}</span><span class="badge">${esc(r.status)}</span></header>
    <p>${esc(r.desc)}</p>${imgs}${steps}${done && r.closedAt ? `<small>تاريخ الإغلاق: ${esc(fmt(r.closedAt))}</small>` : ''}${ctl}</article>`;
}
function exportXlsx() {
  if (!reports.length) return alert('لا توجد بلاغات للتصدير');
  const rows = reports.map(r => ({ 'رقم البلاغ': r.id, 'المصنع': r.factory, 'التاريخ': fmt(r.date), 'وصف العطل': r.desc, 'الحالة': r.status,
    'الخطوات': r.steps.map(s => `[${fmt(s.t)}] ${s.text}`).join('\n'), 'تاريخ الإغلاق': fmt(r.closedAt), 'عدد الصور': r.images.length }));
  const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = [8, 22, 18, 40, 12, 50, 18, 10].map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, ws, 'البلاغات');
  XLSX.writeFile(wb, 'تقرير_بلاغات_الصيانة_' + new Date().toISOString().slice(0, 10) + '.xlsx');
}

me ? start() : showLogin();
</script>
</body>
</html>
